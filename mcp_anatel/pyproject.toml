[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-anatel"
version = "0.1.0"
description = "MCP server for Anatel Consumer & Quality open data (RQUAL, IQS, network indicators, complaints/IDA, satisfaction survey), compatible with Gemini Enterprise Custom MCP Server and the ADK agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "mcp>=2.3.0,<3",
    "httpx>=0.28.0",
    "polars>=1.15.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Observability: export the SDK's built-in MCP spans to Cloud Trace and
    # correlate structured logs with them.
    "opentelemetry-api>=1.30.0,<2",
    "opentelemetry-sdk>=1.30.0,<2",
    "opentelemetry-exporter-gcp-trace>=1.9.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
mcp-anatel = "src.main:run_cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
