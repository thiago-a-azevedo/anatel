# Cloud Build CD pipeline: lint -> unit -> golden eval -> deploy -> post-deploy e2e.
#
# Runs as the least-privilege deployer SA created by Terraform (not the
# default Cloud Build SA). Infrastructure is applied separately with Terraform (terraform/).
#
# Manual run:
#   gcloud builds submit --config cloudbuild.yaml --project nprod-demo \
#     --service-account projects/nprod-demo/serviceAccounts/anatel-advisor-deployer@nprod-demo.iam.gserviceaccount.com
# Trigger (after connecting the GitHub repo in Cloud Build > Repositories):
#   gcloud builds triggers create github --name=anatel-advisor-main \
#     --repo-owner=thiago-a-azevedo --repo-name=anatel --branch-pattern='^main$' \
#     --build-config=cloudbuild.yaml --region=us-central1 \
#     --service-account=projects/nprod-demo/serviceAccounts/anatel-advisor-deployer@nprod-demo.iam.gserviceaccount.com
substitutions:
  _REGION: us-central1
options:
  logging: CLOUD_LOGGING_ONLY
  env:
    - GOOGLE_CLOUD_PROJECT=$PROJECT_ID
    - GOOGLE_CLOUD_LOCATION=${_REGION}
    - GOOGLE_GENAI_USE_VERTEXAI=TRUE
    - UV_PYTHON_INSTALL_DIR=/workspace/.uv-python
timeout: 3600s
steps:
  - id: install
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", "pip install -q uv && uv venv .venv --python /usr/local/bin/python3 && uv pip install -q --python .venv/bin/python -e '.[dev]'"]
  - id: lint
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", ".venv/bin/python -m ruff check anatel_advisor mcp_anatel tests deployment"]
  - id: unit-tests
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", ".venv/bin/python -m pytest tests/unit -q && PYTHONPATH=mcp_anatel .venv/bin/python -m pytest mcp_anatel/tests -q"]
  - id: eval
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", ".venv/bin/python -m pytest tests/eval -m eval -q"]
  - id: deploy
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", ".venv/bin/python deployment/deploy.py"]
  - id: e2e
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", ".venv/bin/python tests/e2e/run_remote_stories.py /workspace/e2e_results.json"]
artifacts:
  objects:
    location: gs://${PROJECT_ID}-anatel-advisor-staging/cloudbuild/$BUILD_ID/
    paths: ["e2e_results.json"]
